name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Changed from master to main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # - name: Obfuscate lore markdown files
      #   run: node obfuscate-lore.cjs

      - name: Build static site
        run: |
          yarn build
        env:
          GITHUB_PAGES: true
          VITE_CMS_PAT: ${{ secrets.CMS_PAT }}
          VITE_CMS_PASSWORD_HASH: ${{ secrets.CMS_PASSWORD_HASH }}
          VITE_CONTENT_BASE: https://raw.githubusercontent.com/Shadows-of-Vardoran/Website/main/static/content/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
